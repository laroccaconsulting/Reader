name: Deploy site (readfree.app)

# Publishes the app to Cloudflare at https://readfree.app whenever the published
# branch moves (it's only advanced after CI passes). Uses the same
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets as the relay.
on:
  workflow_dispatch:
  push:
    branches: [claude/offline-ereader-app-k5Pz3]

concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No CLOUDFLARE_API_TOKEN secret yet; skipping deploy."; fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Check generated files and collect the site
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/build.mjs --check && node scripts/dist.mjs && npm ci --prefix site --no-audit --no-fund
      - uses: cloudflare/wrangler-action@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.138.0'
          workingDirectory: site
      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://readfree.app/ | grep -q '<title>Read Free</title>'; then echo "readfree.app is serving this version"; exit 0; fi
            sleep 10
          done
          echo "readfree.app did not serve the app yet (a new custom domain can take a few minutes)"; exit 1
      - name: Smoke test link previews
        if: steps.creds.outputs.ok == 'true'
        run: |
          q='t=It%20is%20a%20truth%20universally%20acknowledged&b=Pride%20and%20Prejudice&a=Jane%20Austen'
          curl -fsS "https://readfree.app/q/pg1342?$q" | grep -q 'property="og:image" content="https://readfree.app/img/pg1342.png'
          type=$(curl -fsS -o /tmp/card.png -w '%{content_type}' "https://readfree.app/img/pg1342.png?$q&v=${GITHUB_SHA}")
          echo "card: $type, $(wc -c < /tmp/card.png) bytes"
          test "$type" = image/png && test $(wc -c < /tmp/card.png) -gt 10000
