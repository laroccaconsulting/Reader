name: Deploy site (readfree.app)

# Publishes the app to Cloudflare at https://readfree.app whenever the published
# branch moves (it's only advanced after CI passes). Uses the same
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets as the relay.
on:
  workflow_dispatch:
  push:
    branches: [claude/offline-ereader-app-k5Pz3]

concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No CLOUDFLARE_API_TOKEN secret yet; skipping deploy."; fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Check generated files and collect the site
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/build.mjs --check && node scripts/dist.mjs
      - uses: cloudflare/wrangler-action@v3
        if: steps.creds.outputs.ok == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: site
      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://readfree.app/ | grep -q '<title>Read Free</title>'; then echo "readfree.app is serving this version"; exit 0; fi
            sleep 10
          done
          echo "readfree.app did not serve the app yet (a new custom domain can take a few minutes)"; exit 1
