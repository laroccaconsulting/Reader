name: Download starter shelf

# Manually refresh books/{id}.txt from Project Gutenberg using data/starter.json.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-download every book
        type: boolean
        default: false

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download books
        run: python3 scripts/download-starter.py ${{ inputs.force && '--force' || '' }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add books/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Refresh starter shelf texts"
          git push
