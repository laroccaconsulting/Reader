name: Catalog probe

# Informational: checks CORS headers of free-library endpoints and dumps
# response samples used to build/verify the catalog parsers.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/cors-probe.yml']

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump samples
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36"
          dump() {
            echo "::group::$1"
            curl -sS -m 30 -L -A "$UA" -H "Origin: https://laroccaconsulting.github.io" -D /tmp/h -o /tmp/b "$1" || true
            grep -iE '^(HTTP/|access-control|content-type|location)' /tmp/h
            echo "--- body (${2:-6000} bytes) ---"
            head -c "${2:-6000}" /tmp/b; echo
            echo "::endgroup::"
          }
          dump "https://standardebooks.org/ebooks?query=frankenstein&per-page=12" 20000
          dump "https://standardebooks.org/ebooks?per-page=12&sort=popularity" 3000
          dump "https://standardebooks.org/ebooks/mary-shelley/frankenstein" 3000
          dump "https://standardebooks.org/feeds/atom/new-releases" 4000
          dump "https://standardebooks.org/feeds/rss/new-releases" 2000
          dump "https://www.gutenberg.org/ebooks/search.opds/?query=frankenstein" 9000
          dump "https://www.gutenberg.org/ebooks/84.opds" 9000
          dump "https://gutendex.com/books/?search=frankenstein" 1500
