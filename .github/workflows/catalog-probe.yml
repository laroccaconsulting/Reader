name: Live library check

# Runs the real Standard Ebooks / Project Gutenberg / Wiktionary integrations
# in a browser daily, so upstream changes that would break Discover are caught.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    paths: ['app/catalog/**', 'app/reader/define.js', 'tests/live/**']

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          CI: 'true'
